<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solano Heat — GTA6-01</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1020; }
      #game, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { pointer-events: none; z-index: 5; }
      #title {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: #fbbf24; font: bold 42px monospace; text-shadow: 0 2px 12px rgba(0,0,0,0.8);
        z-index: 8; pointer-events: none; text-align: center;
      }
      #controls {
        position: fixed; left: 14px; bottom: 12px; z-index: 8; pointer-events: none;
        color: rgba(255,255,255,0.75); font: 12px monospace; line-height: 1.6;
        text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.min.js" } }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="hud"></canvas>
    <div id="title">SOLANO HEAT</div>
    <div id="controls">WASD drive · E enter / exit · X step out · Shift run · Space NOS<br />F shoot · P punch · Q weapon · R radio · 1/2/3 garage · M missions</div>
    <script>
      // The title card fades once the game starts.
      setTimeout(() => {
        const el = document.getElementById('title');
        if (el) el.style.display = 'none';
      }, 2500);
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
