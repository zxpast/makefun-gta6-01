<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solano Heat — GTA VI Fan Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f2f2f2; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; pointer-events: none; z-index: 5; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
  #topleft { top: 14px; left: 16px; }
  #stars { font-size: 30px; letter-spacing: 3px; color: #ffd94a; line-height: 1; }
  #cash { font-size: 26px; font-weight: 800; color: #7ee787; margin-top: 4px; }
  #respect { font-size: 14px; font-weight: 700; color: #ffd94a; margin-top: 2px; }
  #district { font-size: 13px; color: #cdd6e4; margin-top: 2px; }
  #topcenter { top: 12px; left: 50%; transform: translateX(-50%); text-align: center; width: min(560px, 60vw); }
  #dayline { font-size: 12px; letter-spacing: 2px; color: #ffb3c1; font-weight: 700; }
  #objective { font-size: 17px; font-weight: 700; margin-top: 3px; }
  #banner { font-size: 21px; font-weight: 900; color: #ffd94a; margin-top: 6px; opacity: 0; transition: opacity .3s; will-change: opacity; }
  #banner.show { opacity: 1; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.85); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  #bottomright { right: 16px; bottom: 16px; text-align: right; }
  #speed { font-size: 34px; font-weight: 900; }
  #radio { font-size: 12px; color: #cdd6e4; }
  .bar { width: 150px; height: 8px; background: rgba(255,255,255,.18); border-radius: 4px; margin: 4px 0 0 auto; overflow: hidden; }
  .bar > div { height: 100%; }
  #nosfill { background: #4fc3f7; width: 100%; }
  #dmgfill { background: #ff5a5a; width: 0%; }
  .barlabel { font-size: 10px; letter-spacing: 2px; color: #cdd6e4; }
  #bottomleft { left: 16px; bottom: 16px; }
  #prompt { font-size: 14px; font-weight: 700; color: #ffd94a; }
  #minimap { position: fixed; right: 16px; top: 14px; width: 168px; height: 168px; border: 2px solid rgba(255,255,255,.35); border-radius: 8px; z-index: 5; background: rgba(8,12,18,.7); }
  #toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(0,0,0,.75); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; z-index: 6; opacity: 0; pointer-events: none; }
  #toast.show { animation: pop 2.6s ease forwards; }
  #menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(4,6,12,.72); z-index: 10; }
  #menu.open { display: flex; }
  #menu > div { width: min(620px, 92vw); max-height: 92vh; overflow-y: auto; background: #0d1320; border: 1px solid #2a3550; border-radius: 12px; padding: 26px 30px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #menu h1 { font-size: 30px; letter-spacing: 2px; color: #ffd94a; margin-bottom: 6px; }
  #menu .tag { color: #ffb3c1; font-weight: 700; margin-bottom: 10px; }
  #menu p { font-size: 14px; line-height: 1.5; color: #d7deea; margin-bottom: 10px; }
  #menu .keys { font-size: 12px; color: #9aa7bd; }
  #menu button { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #0d1320; background: #ffd94a; border: 0; border-radius: 8px; cursor: pointer; }
  #menu button:hover { background: #ffe27a; }
  .mrow { padding: 9px 12px; border: 1px solid #26314a; border-radius: 8px; margin: 6px 0; cursor: pointer; }
  .mrow.sel { border-color: #ffd94a; background: rgba(255,217,74,.12); }
  .mrow.done { opacity: .55; }
  .mrow b { display: block; font-size: 14px; }
  .mrow span { font-size: 12px; color: #ffd94a; font-weight: 700; }
  .mrow i { display: block; font-size: 12px; color: #9aa7bd; font-style: normal; margin-top: 2px; }
  .mrow em { font-size: 12px; color: #7ee787; font-style: normal; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="minimap" width="168" height="168"></canvas>
<div class="hud" id="topleft">
  <div id="stars">☆☆☆☆☆</div>
  <div id="cash">$500</div>
  <div id="respect">◆ 0 STREET</div>
  <div id="district">Solano Bay</div>
</div>
<div class="hud" id="topcenter">
  <div id="dayline">SOLANO BAY — 7 DAYS TO THE NIGHT JOB</div>
  <div id="objective">Welcome to Solano Bay.</div>
  <div id="banner"></div>
</div>
<div class="hud" id="bottomright">
  <div id="speed">0 km/h</div>
  <div id="radio">Radio off (R)</div>
  <div class="barlabel">NOS — SHIFT</div>
  <div class="bar"><div id="nosfill"></div></div>
  <div class="barlabel">DAMAGE</div>
  <div class="bar"><div id="dmgfill"></div></div>
</div>
<div class="hud" id="bottomleft"><div id="prompt"></div></div>
<div id="toast"></div>
<div id="menu"><div></div></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
