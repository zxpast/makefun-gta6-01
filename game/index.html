<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solano Heat — open-world crime in Solano Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14100c;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { background: rgba(8, 12, 18, 0.72); border: 1px solid rgba(245, 197, 66, 0.35);
    border-radius: 10px; padding: 8px 12px; }
  #topleft { position: absolute; top: 12px; left: 12px; min-width: 230px; }
  #stars { font-size: 22px; letter-spacing: 3px; color: #ffd94a; }
  #cash { font-size: 20px; font-weight: 700; color: #7ee787; }
  #respect { font-size: 14px; color: #f5c542; }
  #district { font-size: 13px; color: #cfe8ff; }
  #dayline { font-size: 12px; color: #ffb86b; letter-spacing: 1px; }
  #objective { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    max-width: 46%; text-align: center; font-size: 15px; font-weight: 600; }
  #minimap { position: absolute; top: 12px; right: 12px; width: 168px; height: 168px;
    border: 1px solid rgba(245, 197, 66, 0.5); border-radius: 10px; background: rgba(8,12,18,0.8); }
  #banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
    font-size: 21px; font-weight: 800; text-align: center; color: #ffd94a;
    text-shadow: 0 2px 10px #000; opacity: 0; transition: opacity .3s; max-width: 80%; }
  #banner.show { opacity: 1; }
  #speedbox { position: absolute; right: 12px; bottom: 14px; text-align: right; }
  #speed { font-size: 30px; font-weight: 800; }
  #radio { font-size: 13px; color: #ffb86b; }
  .bar { width: 170px; height: 9px; background: rgba(255,255,255,.18); border-radius: 5px; overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; }
  #nosfill { background: #4fc3f7; width: 100%; }
  #dmgfill { background: #ff4444; width: 0%; }
  .barlabel { font-size: 11px; color: #ddd; letter-spacing: 1px; }
  #prompt { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    font-size: 15px; font-weight: 600; background: rgba(8,12,18,.75); padding: 6px 14px;
    border-radius: 8px; border: 1px solid rgba(255,255,255,.25); }
  #prompt:empty { display: none; }
  #toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
    font-size: 15px; color: #7ee787; opacity: 0; transition: opacity .3s; font-weight: 600;
    text-shadow: 0 1px 6px #000; }
  #toast.show { opacity: 1; }
  #menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(6, 8, 14, 0.78); z-index: 10; pointer-events: auto; }
  #menu.open { display: flex; }
  #menu > div { width: min(680px, 92vw); max-height: 88vh; overflow-y: auto; background: #101623;
    border: 1px solid #f5c542; border-radius: 14px; padding: 26px 30px; }
  #menu h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: 2px; color: #f5c542; }
  #menu .tag { color: #ffb86b; margin: 0 0 14px; font-size: 15px; }
  #menu p { line-height: 1.5; }
  #menu .keys { font-size: 13px; color: #9fb3cc; }
  #menu button { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 16px;
    font-weight: 700; color: #101623; background: #f5c542; border: 0; border-radius: 8px; cursor: pointer; }
  #menu button:hover { background: #ffd94a; }
  .mrow { padding: 10px 12px; border: 1px solid rgba(255,255,255,.16); border-radius: 8px;
    margin: 6px 0; cursor: pointer; }
  .mrow.sel { border-color: #f5c542; background: rgba(245,197,66,.12); }
  .mrow.done { opacity: .6; }
  .mrow.locked { opacity: .4; }
  .mrow b { display: block; font-size: 15px; }
  .mrow span { float: right; color: #ffd94a; }
  .mrow i { display: block; font-size: 13px; color: #c9d6e8; margin-top: 2px; }
  .mrow em { font-size: 12px; color: #7ee787; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Solano Heat: drive through Solano Bay, take jobs, outrun the police"></canvas>
<div id="hud">
  <div id="topleft" class="panel">
    <div id="stars">☆☆☆☆☆</div>
    <div id="cash">$500</div>
    <div id="respect">◆ 0 STREET</div>
    <div id="district">Solano Bay</div>
    <div id="dayline">SOLANO BAY — 7 DAYS TO THE NIGHT JOB</div>
  </div>
  <div id="objective" class="panel">Free roam — pick a mission (M) or find a side job marker</div>
  <canvas id="minimap" width="168" height="168"></canvas>
  <div id="banner"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="speedbox" class="panel">
    <div id="speed">0 km/h</div>
    <div class="barlabel">NOS — SHIFT</div>
    <div class="bar"><div id="nosfill"></div></div>
    <div class="barlabel">DAMAGE</div>
    <div class="bar"><div id="dmgfill"></div></div>
    <div id="radio">Radio off (R)</div>
  </div>
</div>
<div id="menu"><div></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
